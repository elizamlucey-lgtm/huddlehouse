
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation | Huddlehouse</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="logo">Huddlehouse<span>.</span></a>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="library.html">Library</a>
            <a href="index.html#projects">Projects</a>
            <a href="developer.html" class="active">Developer Hub</a>
            <a href="index.html#academy">Academy</a>
        </nav>
    </header>

    <main class="article-layout">

        <aside class="article-sidebar">
            <a href="developer.html" class="back-link" id="back-link">← Back to Developer Hub</a>

            <h3 id="sidebar-heading">Developer Hub</h3>

            <nav class="article-nav" id="article-nav">
                <a href="article.html?doc=quickstart">API Quickstart</a>
                <a href="article.html?doc=authentication">Authentication</a>
                <a href="article.html?doc=api-reference">API Reference</a>
                <a href="article.html?doc=errors">Errors & Troubleshooting</a>
            </nav>
        </aside>

        <article class="article-content">
            <div id="article-breadcrumb">
                <a href="developer.html">Developer Hub</a> / Documentation
            </div>

            <div id="markdown-content">
                <p>Loading documentation...</p>
            </div>
        </article>

    </main>

    <footer class="site-footer">
        <p>© 2026 Huddlehouse. Good work happens together.</p>
    </footer>

    <script>
        const documents = {
            "index": {
                file: "docs/library/index.md",
                title: "Library Overview",
                section: "library"
            },
            "getting-started": {
                file: "docs/library/getting-started.md",
                title: "Getting Started with Huddlehouse",
                section: "library"
            },
            "troubleshooting": {
                file: "docs/library/troubleshooting.md",
                title: "Troubleshooting Huddlehouse",
                section: "library"
            },
            "quickstart": {
                file: "docs/developer/quickstart.md",
                title: "API Quickstart",
                section: "developer"
            },
            "authentication": {
                file: "docs/developer/authentication.md",
                title: "API Authentication",
                section: "developer"
            },
            "api-reference": {
                file: "docs/developer/api-reference.md",
                title: "API Reference",
                section: "developer"
            },
            "errors": {
                file: "docs/developer/errors.md",
                title: "Errors & Troubleshooting",
                section: "developer"
            }
        };

        const libraryNavigation = `
            <a href="article.html?doc=index">Library Overview</a>
            <a href="article.html?doc=getting-started">Getting Started</a>
            <a href="article.html?doc=troubleshooting">Troubleshooting</a>
        `;

        const developerNavigation = `
            <a href="article.html?doc=quickstart">API Quickstart</a>
            <a href="article.html?doc=authentication">Authentication</a>
            <a href="article.html?doc=api-reference">API Reference</a>
            <a href="article.html?doc=errors">Errors & Troubleshooting</a>
        `;

        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const doc = params.get("doc");
            const article = documents[doc];
            const content = document.getElementById("markdown-content");
            const breadcrumb = document.getElementById("article-breadcrumb");
            const sidebarHeading = document.getElementById("sidebar-heading");
            const articleNav = document.getElementById("article-nav");
            const backLink = document.getElementById("back-link");

            if (!article) {
                content.innerHTML =
                    "<h1>Article not found</h1><p>Select a resource from the Library or Developer Hub.</p>";
                return;
            }

            const isDeveloper = article.section === "developer";

            const sectionName = isDeveloper ? "Developer Hub" : "Library";
            const sectionLink = isDeveloper ? "developer.html" : "library.html";

            document.title = article.title + " | Huddlehouse";

            sidebarHeading.textContent = sectionName;
            articleNav.innerHTML = isDeveloper ? developerNavigation : libraryNavigation;
            backLink.href = sectionLink;
            backLink.textContent = "← Back to " + sectionName;

            try {
                const response = await fetch(article.file);

                if (!response.ok) {
                    throw new Error("Documentation could not be loaded.");
                }

                const markdown = await response.text();

                content.innerHTML = marked.parse(markdown);

                content.querySelectorAll("a").forEach(link => {
                    const href = link.getAttribute("href");

                    if (href && href.endsWith(".md")) {
                        const filename = href.split("/").pop().replace(".md", "");

                        link.href = "article.html?doc=" + encodeURIComponent(filename);
                    }
                });

                breadcrumb.innerHTML =
                    '<a href="' + sectionLink + '">' + sectionName + '</a> / ' + article.title;

            } catch (error) {
                console.error("Documentation loading error:", error);

                content.innerHTML =
                    "<h1>Unable to load documentation</h1>" +
                    "<p>Check that the documentation file exists and try refreshing the page.</p>";
            }
        }

        loadArticle();
    </script>

</body>
</html>
